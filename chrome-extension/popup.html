<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Activity collector</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <h1>Activity collector</h1>
      <p>Use the dashboard URL that reaches the Django API, then paste the one-time employee token.</p>
      <label for="apiBase">Dashboard/API URL</label>
      <input id="apiBase" type="url" placeholder="http://localhost:5173">
      <label for="token">Collector token</label>
      <input id="token" type="password" autocomplete="off">
      <label class="check"><input id="enabled" type="checkbox"> Tracking enabled</label>
      <button id="save" type="button">Save and test</button>
      <p id="status" role="status"></p>
      <small>Only HTTP(S) page addresses and active time are submitted. Query strings and fragments are removed by the server.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
